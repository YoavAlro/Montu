[project]
name = "montu"
version = "0.7.1"
description = "Config-driven monitoring-spec engine: lints checked-in monitoring.yaml files against the code they pin, prints the monitoring estate, and optionally compiles and reconciles specs to configured providers."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
montu = "montu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montu"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
